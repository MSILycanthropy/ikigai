# Compressed swap in RAM. zstd averages about 3:1, so a full zram0 sized to the whole of
# RAM still occupies about a third of it; anything smaller spills reclaim to disk. When swap
# is full the kernel can only reclaim file pages, and a game's mapped assets go first.
# The resident limit caps what the compressed store may hold in RAM, so incompressible data
# cannot let it eat the memory it is there to relieve.
[zram0]
zram-size = ram
zram-resident-limit = ram / 3
compression-algorithm = zstd
swap-priority = 100
