# Swap is zram only (config/system/zram): RAM, not a disk. The defaults treat swap as slow, so
# under pressure the kernel drops file pages first, a game's mapped assets among them, rather
# than compress the idle anon pages of a build or a browser. Prefer compressing; and no swap
# readahead, since every zram page is a decompress rather than a seek.
vm.swappiness = 100
vm.page-cluster = 0
