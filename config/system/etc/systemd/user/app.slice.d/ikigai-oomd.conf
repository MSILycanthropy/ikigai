# Every app the shell launches runs in its own scope under app.slice (shell/Apps.qml). When
# the slice has been under memory pressure for a while, systemd-oomd kills the worst scope:
# one runaway app dies instead of the whole session stalling. The shell and the compositor
# are outside the slice and never candidates.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
