; gamemode, for the games launched with `gamemoderun %command%`. Its stock renice is 0, so
; on its own it only pins the CPU to performance: this puts every thread of the game at
; nice -10, the one weight scx_lavd reads, so a nice-0 build cannot preempt it. Needs the
; gamemode group in the login session (/etc/security/limits.d/10-gamemode.conf gives the
; group nice -10; ikigai-steam adds you, a re-login applies).
[general]
renice=10
softrealtime=off
; A Windows app taking a split lock is throttled by the kernel for ~10 ms a time by default;
; some Proton games do it every frame. Off while a game runs.
disable_splitlock=1
